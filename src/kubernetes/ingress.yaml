apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:

          # Events
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082

          # Health
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          # Movies
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: movies-service
                port:
                  number: 8081

          # Monolith
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: monolith
                port:
                  number: 8080
          
          # Proxy
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000